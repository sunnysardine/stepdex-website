name: Browser checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser test tools
        run: npm install --prefix qa --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: ./qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check mobile menus, layouts, photos and enquiry links
        run: node qa/browser-checks.cjs
      - name: Publish summary
        if: always()
        run: |
          if [ -f qa/results/summary.md ]; then
            cat qa/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-check-results
          path: qa/results/
          retention-days: 14
